# Copy to inventory/hosts.ini (gitignored) and fill in real hosts.
# Never commit a live inventory — it is the one file that usually
# carries private IPs, Tailscale addresses, and usernames.

[hermes_nodes]
# Fresh Linux box (Job A — deploy-hermes-node.yml)
# new-node ansible_host=203.0.113.10 ansible_user=ubuntu ansible_python_interpreter=/usr/bin/python3

[macos_hermes_hosts]
# Existing macOS multi-seat host (Job B / Job C)
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
